name: Go CI & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Test and Cross-Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Unit Tests
        run: go test -v -race -cover ./...

      - name: Build Linux Binary
        run: |
          GOOS=linux GOARCH=amd64 go build -v -o bin/gopher-linux-amd64 main.go

      - name: Build Windows Binary
        run: |
          GOOS=windows GOARCH=amd64 go build -v -o bin/gopher-windows-amd64.exe main.go

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: gopher-binaries
          path: bin/
